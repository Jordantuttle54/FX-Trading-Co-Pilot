name: Tests

# Runs on every push and pull request. These suites exist because the same
# class of bug - the app using a convenient price instead of the true one -
# was found six separate times; catching a regression here is much cheaper
# than finding it in the trade journal afterwards.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt httpx

      - name: Run test suites
        run: python tests/run_all.py
